services:
  - type: web
    name: vigil-app
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install && cd .. && cd frontend && npm install && npm run build && cd ..
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
